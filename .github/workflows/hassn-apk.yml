name: Build Hassn APK

# Manual dispatch, plus pushes to the build mirror branch hassn-build. The APK is
# uploaded as a run artifact; this workflow never creates a tag or a GitHub Release.
on:
  push:
    branches: [hassn-build]
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug or release (release is signed with the runner's debug key)"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

concurrency:
  group: hassn-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_R28: 28.0.12433566
  NDK_AGP: 27.0.12077973   # AGP 8.7 default NDK, requested at configure time by externalNativeBuild
  HASSN_PACKAGE: com.hassn.app

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Secret guard (no keys/tokens in the tree; unit-test fixtures excluded)
        run: |
          if grep -rInE '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)' \
               --exclude-dir=.git --exclude-dir=deps --exclude-dir=test --exclude='*.apk' --exclude='*.tar.gz' src .github; then
            echo "::error::possible secret in source"; exit 1
          fi
          echo "secret guard ok"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: actions/setup-go@v5
        with: { go-version-file: deps/rclone-mobile/go.mod, cache: false }

      - name: Android SDK / NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_R28" "ndk;$NDK_AGP" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_R28" >> "$GITHUB_ENV"

      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/gomobile" init

      - name: rclone.aar (backup destinations; build artifact, not checked in)
        run: |
          bash ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Sandbox assets present (PRoot + Alpine are checked in)
        run: |
          A=src/android/app/src/main
          for f in $A/assets/proot-aarch64 $A/assets/alpine-minirootfs.tar.gz \
                   $A/jniLibs/arm64-v8a/libproot.so $A/jniLibs/arm64-v8a/libproot-loader.so $A/jniLibs/arm64-v8a/libproot-loader32.so; do
            [ -s "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          ls -la $A/assets/proot-aarch64 $A/jniLibs/arm64-v8a/

      - name: Unit tests (Hassn)
        run: |
          cd src/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.openminis.app.hassn.*' --tests 'com.openminis.app.agent.SoulIcon*'

      - name: Assemble APK
        timeout-minutes: 45
        run: |
          cd src/android
          T=${{ inputs.build_type || 'debug' }}
          if [ "$T" = release ]; then ./gradlew --no-daemon :app:assembleRelease; else ./gradlew --no-daemon :app:assembleDebug; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          find app/build/outputs/apk -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Verify package id
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          for f in out/*.apk; do
            pkg=$("$BT/aapt2" dump badging "$f" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            label=$("$BT/aapt2" dump badging "$f" | sed -n "s/^application-label:'\(.*\)'/\1/p")
            echo "$f package=$pkg label=$label"
            [ "$pkg" = "$HASSN_PACKAGE" ] || { echo "::error::wrong package $pkg"; exit 1; }
            unzip -l "$f" | grep -q 'lib/arm64-v8a/libproot-loader.so' || { echo "::error::proot loader missing from APK"; exit 1; }
          done
          sha=$(git rev-parse --short HEAD)
          for f in out/*.apk; do mv "$f" "out/hassn-${{ inputs.build_type || 'debug' }}-$sha.apk"; done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: hassn-apk-${{ inputs.build_type || 'debug' }}
          path: out/*.apk
          retention-days: 14

  # [Hassn-P1] Real screenshots of the debug APK on an API 34 x86_64 emulator (ARM translation
  # runs the arm64-only APK). Shell tabs / pages are opened with the launch extras HassnShell
  # reads: hassn_tab 0..3, hassn_open settings|ledger.
  shots:
    needs: apk
    if: ${{ (inputs.build_type || 'debug') == 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with: { name: hassn-apk-debug, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Write screenshot script
        run: |
          cat > shots.sh <<'SH'
          # No `set -e`: every step has its own timeout, one hang must not kill the rest.
          set -x
          mkdir -p shots
          P=com.hassn.app
          A=$P/com.openminis.app.MainActivity
          T() { timeout "$@"; }
          dismiss() {
            T 10 adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1
            # an ANR/crash dialog that still shows: its default button is "Wait"/"Close app" → ENTER
            if T 10 adb shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus=.*(Application Not Responding|Error|aerr|anr)" ; then
              T 5 adb shell input keyevent KEYCODE_ENTER
            fi
          }
          wait_boot() { for i in $(seq 1 90); do [ "$(T 5 adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && return 0; sleep 2; done; return 1; }
          # system hardening against launcher/ANR stalls under ARM translation
          T 20 adb shell settings put global hide_error_dialogs 1
          T 20 adb shell settings put global anr_show_background 0
          T 20 adb shell settings put global window_animation_scale 0
          T 20 adb shell settings put global transition_animation_scale 0
          T 20 adb shell settings put global animator_duration_scale 0
          T 20 adb shell settings put system screen_off_timeout 1800000
          T 20 adb shell svc power stayon true
          T 30 adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
          T 30 adb shell pm disable-user --user 0 com.android.launcher3
          # Chinese UI: system locale (needs root + soft restart), plus per-app locale as a fallback
          if T 20 adb root; then
            sleep 3; T 20 adb wait-for-device
            T 10 adb shell setprop persist.sys.locale zh-CN
            T 10 adb shell setprop ctl.restart zygote
            sleep 10; T 30 adb wait-for-device; wait_boot
          fi
          T 15 adb shell input keyevent KEYCODE_WAKEUP
          T 15 adb shell wm dismiss-keyguard
          T 180 adb install -r -g apk/*.apk || { echo "::error::install failed"; exit 1; }
          T 20 adb shell cmd locale set-app-locales $P --user 0 --locales zh-CN
          T 20 adb shell pm grant $P android.permission.POST_NOTIFICATIONS
          T 20 adb shell getprop persist.sys.locale
          shot() { # name wait-seconds
            sleep "${2:-10}"; dismiss
            for try in 1 2 3; do
              T 30 adb exec-out screencap -p > "shots/$1.png"
              [ "$(stat -c %s "shots/$1.png" 2>/dev/null || echo 0)" -gt 20000 ] && break
              T 30 adb shell screencap -p /sdcard/s.png && T 30 adb pull /sdcard/s.png "shots/$1.png"
              [ "$(stat -c %s "shots/$1.png" 2>/dev/null || echo 0)" -gt 20000 ] && break
              dismiss; sleep 8
            done
            ls -la "shots/$1.png"
            T 10 adb shell dumpsys window | grep mCurrentFocus | tee -a shots/focus.txt
          }
          go() { # name wait extras...
            n=$1; w=$2; shift 2
            dismiss
            T 60 adb shell am start -S -W -n $A "$@"
            shot "$n" "$w"
          }
          go 00_first_launch 25
          go 01_home 14 --ei hassn_tab 0
          go 02_chat 16 --ei hassn_tab 1
          go 03_feed 12 --ei hassn_tab 2
          go 04_projects 12 --ei hassn_tab 3
          go 05_settings 12 --es hassn_open settings
          T 20 adb shell input swipe 540 1800 540 500 500; shot 05b_settings_scrolled 4
          T 20 adb shell input swipe 540 1800 540 500 500; shot 05c_settings_bottom 4
          go 06_ledger 12 --es hassn_open ledger
          go 06b_ledger_box 12 --es hassn_open ledger_box
          go 08_chats 14 --es hassn_open chats
          go 09_model_groups 12 --es hassn_open model_groups
          go 10_providers 12 --es hassn_open providers
          go 11_skills 14 --es hassn_open skills
          go 12_mcp 12 --es hassn_open mcp
          go 13_memory 12 --es hassn_open memory
          go 14_scheduled 12 --es hassn_open scheduled
          go 15_gateway 12 --es hassn_open gateway
          T 20 adb shell cmd uimode night yes
          go 07_home_dark 14 --ei hassn_tab 0
          go 07b_settings_dark 12 --es hassn_open settings
          T 20 adb shell cmd uimode night no
          T 60 adb logcat -d -t 4000 > shots/logcat.txt
          T 30 adb shell dumpsys activity processes | grep -i -E "anr|crash|not responding" > shots/anr.txt
          exit 0
          SH
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          cores: 4
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -skin 1080x2400 -memory 4096
          disable-animations: true
          script: timeout 2700 bash shots.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hassn-shots
          path: shots/
          retention-days: 14
